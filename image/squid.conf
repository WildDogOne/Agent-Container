# Loopback-only forward proxy that allowlists egress by domain. Bound to
# 127.0.0.1 so it's reachable only from inside this container - matters most
# under run.sh --host-network, where the container shares the host's network
# namespace outright: anything bound to a non-loopback address here would be
# reachable from the whole host network, and the container likewise reaches
# every service listening on the host's own 127.0.0.1 (that unrestricted
# two-way loopback access, not just the inbound side, is why --host-network
# is a last resort).
http_port 127.0.0.1:3128

# Both files are generated by entrypoint.sh from /etc/squid/allowed-domains.txt at
# startup: the domains (and bare IPv4/CIDR entries, as a separate dst ACL - dstdomain
# never matches a request to a raw IP), and 80/443 plus any `entry:port` ports from
# the list.
acl allowed_dst dstdomain "/etc/squid/allowed-dstdomains.txt"
acl allowed_ip dst "/etc/squid/allowed-dsts.txt"
acl SSL_ports port "/etc/squid/allowed-ports.txt"
acl Safe_ports port "/etc/squid/allowed-ports.txt"
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access allow allowed_ip
http_access deny all

# Dev container, not a shared cache - keep it simple and avoid needing a
# cache_dir/spool at all.
cache deny all

access_log /tmp/squid-access.log
cache_log /tmp/squid-cache.log
pid_filename /tmp/squid.pid
via off
forwarded_for delete
