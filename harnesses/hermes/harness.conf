# Hermes Agent - see ../README.md for the format.
command=hermes
# Login (auth.json), memories, sessions, state.db, logs, caches. The per-home
# dependency environment Hermes prepares on first launch (installs/) is NOT shared:
# hermes-session keeps it container-local (see the wrapper's comment), since Hermes
# executes it and a session must not be able to plant code the host's native hermes
# later runs. Cost: installs/ is re-prepared per session.
state=.hermes
# Settings, API keys, identity, and anything Hermes runs on its own (skills, hooks,
# plugins, scheduled jobs).
config=.hermes/config.yaml .hermes/.env .hermes/SOUL.md .hermes/skills .hermes/hooks .hermes/plugins .hermes/cron
# The install itself (see install.sh): Hermes only runs a checkout owned by the current user.
owned=/opt/hermes
